[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "music-stream-flow-pipelines"
version = "0.1.0"
description = "ETL pipelines for loading music-stream-flow data into ClickHouse."
requires-python = ">=3.14"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
exclude = ["src.__pycache__", "src.*.__pycache__"]
namespaces = true
