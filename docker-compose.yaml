services:
  music-oltp:
    image: postgres:18.3-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - ./sql/music_oltp/ddl/01-create.sql:/docker-entrypoint-initdb.d/01-create.sql
      - ./sql/music_oltp/ddl/02-constraints.sql:/docker-entrypoint-initdb.d/02-constraints.sql
      - ./sql/music_oltp/ddl/03-indexes.sql:/docker-entrypoint-initdb.d/03-indexes.sql
    environment:
      POSTGRES_USER: ${MUSIC_OLTP_USERNAME}
      POSTGRES_PASSWORD: ${MUSIC_OLTP_PASSWORD}
      POSTGRES_DB: ${MUSIC_OLTP_DATABASE}
    ports:
      - "${MUSIC_OLTP_PORT}:${MUSIC_OLTP_INTERNAL_PORT}"